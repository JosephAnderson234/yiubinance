<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">YiuBinance: una moneda tranquila con lentes de sol</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f4c47"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <!-- Fondo: Telegram lo recorta en círculo, así que todo lo importante queda en el centro. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Sombra de la moneda -->
  <ellipse cx="262" cy="420" rx="120" ry="18" fill="#042f2e" opacity="0.45"/>

  <g transform="rotate(-8 256 256)">
    <!-- Canto y cara de la moneda -->
    <circle cx="256" cy="262" r="160" fill="#b45309"/>
    <circle cx="256" cy="250" r="160" fill="url(#coin)"/>
    <circle cx="256" cy="250" r="138" fill="none" stroke="#d97706" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
    <circle cx="256" cy="250" r="124" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>

    <!-- Lentes de sol -->
    <path d="M150 212 h86 q6 0 6 7 l-6 34 q-5 30 -40 30 q-34 0 -42 -30 l-9 -33 q-1 -8 5 -8 z" fill="url(#lens)"/>
    <path d="M276 212 h86 q6 0 5 8 l-9 33 q-8 30 -42 30 q-35 0 -40 -30 l-6 -34 q0 -7 6 -7 z" fill="url(#lens)"/>
    <path d="M240 222 q16 -10 32 0" fill="none" stroke="#030712" stroke-width="9" stroke-linecap="round"/>
    <path d="M150 216 l-26 -10" stroke="#030712" stroke-width="8" stroke-linecap="round"/>
    <path d="M362 216 l26 -10" stroke="#030712" stroke-width="8" stroke-linecap="round"/>
    <!-- Brillos en los lentes -->
    <path d="M172 226 l22 0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
    <path d="M298 226 l22 0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>

    <!-- Sonrisa relajada, de lado -->
    <path d="M206 318 q46 34 104 4" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
    <path d="M312 320 q8 -2 12 -10" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>

    <!-- Brillo de la moneda -->
    <path d="M160 168 q30 -46 84 -56" fill="none" stroke="#fffbeb" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Destellos -->
  <g fill="#fef3c7">
    <path d="M412 112 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z"/>
    <path d="M98 372 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" opacity="0.8"/>
  </g>
</svg>
